<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#173d34">
	<meta name="description" content="A clear, practical dashboard for managing students, courses, and attendance.">
	<title>Campusly | Student Management</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
	<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
	<script src="script.js" defer></script>
</head>
<body>
	<div id="auth-root"></div>
	<div class="app-shell">
		<aside class="sidebar" id="sidebar" aria-label="Main navigation">
			<a class="brand" href="#overview" aria-label="Campusly home">
				<span class="brand-mark"><i data-lucide="graduation-cap"></i></span>
				<span class="brand-name">campusly<span>.</span><small>ACADEMIC PORTAL</small></span>
			</a>
			<div class="nav-label">WORKSPACE</div>
			<nav class="primary-nav">
				<button class="nav-link active" data-view="overview"><i data-lucide="layout-dashboard"></i><span>Overview</span></button>
				<button class="nav-link" data-view="students"><i data-lucide="users-round"></i><span>Students</span><span class="nav-count" id="student-nav-count">248</span></button>
				<button class="nav-link" data-view="courses"><i data-lucide="library-big"></i><span>Courses</span></button>
				<button class="nav-link" data-view="attendance"><i data-lucide="clipboard-check"></i><span>Attendance</span></button>
				<button class="nav-link" data-view="database"><i data-lucide="database"></i><span>Data collection</span></button>
				<button class="nav-link" data-view="reports"><i data-lucide="chart-no-axes-column-increasing"></i><span>Reports</span></button>
			</nav>
			<div class="sidebar-bottom">
				<div class="term-card"><span class="term-dot"></span><div><strong>Fall semester</strong><small>2025 – 2026</small></div><i data-lucide="chevrons-up-down"></i></div>
				<button class="nav-link settings-link" data-view="settings"><i data-lucide="settings-2"></i><span>Settings</span></button>
				<div class="sidebar-profile"><div class="avatar avatar-admin" id="profile-avatar">JE</div><div class="profile-copy"><strong id="profile-name">Joel Earnest</strong><small>Administrator</small></div><button class="icon-button profile-menu" data-action="logout" aria-label="Sign out" title="Sign out"><i data-lucide="log-out"></i><span>Sign out</span></button></div>
			</div>
		</aside>

		<main class="main-area">
			<div class="preview-banner" id="preview-banner" role="status" hidden>GitHub Pages preview · Sample data only; changes are not saved.</div>
			<header class="topbar">
				<button class="icon-button menu-toggle" id="menu-toggle" aria-label="Open navigation"><i data-lucide="menu"></i></button>
				<div class="breadcrumbs"><span>Workspace</span><i data-lucide="chevron-right"></i><strong id="breadcrumb-current">Overview</strong></div>
				<div class="topbar-actions">
					  <label class="global-search"><i data-lucide="search"></i><input id="global-search" type="search" placeholder="Search students..." autocomplete="off"><kbd>Ctrl K</kbd></label>
					<button class="icon-button notification-button" aria-label="Notifications" aria-expanded="false"><i data-lucide="bell"></i><span class="notification-dot" aria-hidden="true" hidden></span></button>
					<div class="topbar-divider"></div>
					<button class="topbar-user" aria-label="Signed in user"><span class="avatar avatar-admin">JE</span><span class="topbar-user-name">Joel Earnest</span><i data-lucide="chevron-down"></i></button>
				</div>
			</header>

			<div class="content-wrap"><div class="view-content" id="view-content" aria-live="polite"></div></div>
			<footer class="footer"><span>© 2026 Campusly</span><span>Academic year 2025–26 <span class="footer-separator">·</span> All systems operational <span class="system-dot"></span></span></footer>
		</main>
	</div>
	<div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
